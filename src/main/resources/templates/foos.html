<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <title>Casdoor Shiro Example</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/4.6.2/css/bootstrap.min.css"/>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-light shadow-sm p-3 mb-5">
    <a class="navbar-brand" th:href="@{/}">Casdoor Shiro Example</a>
    <ul class="navbar-nav ml-auto">
        <li class="navbar-text mr-3">Hi, <span th:text="${user.displayName}">user</span>
            (<span th:text="${user.owner + '/' + user.name}">owner/name</span>)
        </li>
        <li>
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="btn btn-outline-danger">Logout</button>
            </form>
        </li>
    </ul>
</nav>
<div class="container">
    <h1>All Foos:</h1>
    <table class="table table-bordered table-striped">
        <thead>
        <tr>
            <td>ID</td>
            <td>Name</td>
        </tr>
        </thead>
        <tbody>
        <tr th:each="foo : ${foos}">
            <td th:text="${foo.id}">ID</td>
            <td th:text="${foo.name}">Name</td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
